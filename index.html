<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div class="search-filter d-flex flex-column flex-sm-row gap-3 align-items-center justify-content-evenly">
     
     <div class="inputParent d-flex gap-5">
      <h2>E-Shop</h2>
      <input type="text" placeholder="search" class="search-input" />
     </div>


  <div class="filterSortParent d-flex flex-column flex-md-row align-items-end gap-3 justify-content-end">
    <!--filter categories-->
    <div class="category-filter">
      <label for="category-select">Category</label>

      <select id="category-select" class="category-select">
        <option value="all">All Categories</option>
        <option value="electronics">Electronics</option>
        <option value="jewelery">Jewelery</option>
        <option value="men's clothing">Men's Clothing</option>
        <option value="women's clothing">Women's Clothing</option>
      </select>
    </div>

    <!--sorting-->

    <div class="sort-filter">
      <label for="sort-select">Sort by</label>
    
      <select id="sort-select" class="sort-select">
        <option value="default">Default</option>
        <option value="price-low">Price: Low to High</option>
        <option value="price-high">Price: High to Low</option>
        <option value="name-a-z">Name: A to Z</option>
        <option value="name-z-a">Name: Z to A</option>
      </select>
    </div>
  </div>
    </div>




    <!--products section-->

    <div class="product-section"></div>

    <!--pagination-->
    <div class="pagination"></div>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <script src="script.js"></script>
  </body>
</html>
